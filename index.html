<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mason Butler</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1f2937, #111827);
        color: #f9fafb;
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 3rem 2.5rem;
        border-radius: 16px;
        text-align: center;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
        font-size: 2.8rem;
        margin-bottom: 1rem;
        letter-spacing: 1px;
    }

    .subtitle {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        color: #9ca3af;
    }

    .github-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        background: #24292e;
        color: white;
        padding: 0.9rem 1.8rem;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .github-btn:hover {
        background: #444c56;
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .github-icon {
        width: 20px;
        height: 20px;
        fill: white;
    }

    footer {
        margin-top: 2.5rem;
        font-size: 0.85rem;
        color: #6b7280;
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 2.2rem;
        }
        .subtitle {
            font-size: 1rem;
        }
    }
</style>
</head>
